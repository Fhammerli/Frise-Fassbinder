<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chargement de Fassbinder Explorer — Version 2.8</title>
</head>
<body>
<p id="v28-loader" style="font-family:system-ui,sans-serif;padding:2rem">Chargement de la version 2.8…</p>
<script>
(async function loadVersion28(){
  const sourceUrl = 'https://raw.githubusercontent.com/Fhammerli/Frise-Fassbinder/43ad86c811f5e1e5841df72d5430a839d53a3450/index.html';
  const override = "\n// ===== V2.8 : lecture robuste de plusieurs liens dans une cellule =====\nparseLinksCell = function(ws,r,c,cellText){\n  const cell=ws[XLSX.utils.encode_cell({r,c})];\n  const nativeUrl=(cell && cell.l && cell.l.Target) ? cell.l.Target.trim() : '';\n  const chunks=(cellText||'').split(/[;\\n]/).map(s=>s.trim()).filter(Boolean);\n\n  if(!chunks.length){\n    if(!nativeUrl) return [];\n    const kind=classifyLinkKind(nativeUrl);\n    return [{url:nativeUrl,kind,customLabel:false,label:defaultLinkLabel(kind,0,1)}];\n  }\n\n  const links=[];\n  chunks.forEach((chunk,i)=>{\n    const pipeIdx=chunk.indexOf('|');\n    let label='',url='';\n\n    if(pipeIdx>-1){\n      label=chunk.slice(0,pipeIdx).trim();\n      url=chunk.slice(pipeIdx+1).trim();\n    } else if(/^(https?:\\/\\/|www\\.)/i.test(chunk)){\n      url=chunk;\n    } else if(i===0 && nativeUrl){\n      label=chunk;\n      url=nativeUrl;\n    } else {\n      console.warn(\n        'Lien non identifié dans la frise : « '+chunk+\n        ' ». Utilisez « Libellé|https://adresse » pour les liens supplémentaires.'\n      );\n      return;\n    }\n\n    if(/^www\\./i.test(url)) url='https://'+url;\n    if(!url) return;\n\n    const kind=classifyLinkKind(url);\n    links.push({\n      url,\n      kind,\n      customLabel:Boolean(label),\n      label:label || defaultLinkLabel(kind,links.length,chunks.length)\n    });\n  });\n\n  return links;\n};\n";

  try {
    const response = await fetch(sourceUrl, {cache:'no-store'});
    if(!response.ok) throw new Error('Version 2.7 inaccessible ('+response.status+')');
    let source = await response.text();

    source = source.replaceAll('Version 2.7','Version 2.8');

    const lastScriptClose = source.lastIndexOf('<\/script>');
    if(lastScriptClose < 0) {
      throw new Error('Structure HTML de la version 2.7 non reconnue.');
    }

    source = source.slice(0,lastScriptClose) + '\n' + override + '\n' + source.slice(lastScriptClose);

    document.open();
    document.write(source);
    document.close();
  } catch(error) {
    document.getElementById('v28-loader').textContent =
      'Erreur de chargement de la version 2.8 : '+error.message;
    console.error(error);
  }
})();
</script>
</body>
</html>
