<script id="learning-tools-script">
(function(){
'use strict';
const DEFAULT_QUIZ_FILES=['RWF_Quiz.csv'];
const DEFAULT_FLASHCARD_FILES=['RWF_Flashcards.csv'];
const state={quizSets:new Map(),flashSets:new Map(),quiz:null,flash:null};
const overlay=document.getElementById('learningOverlay');
const drawer=document.getElementById('learningDrawer');
const content=document.getElementById('learningContent');
const closeBtn=document.getElementById('learningClose');
const normKey=s=>(s||'').toString().normalize('NFD').replace(/[\\u0300-\\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();
const text=v=>v==null?'':String(v).trim();
const escapeHTML=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
function field(row,aliases){const entries=Object.entries(row);for(const alias of aliases){const target=normKey(alias);const found=entries.find(([k])=>normKey(k)===target);if(found&&text(found[1]))return text(found[1]);}return '';}
function parseDelimited(raw){
  if(!window.XLSX) throw new Error('Le lecteur CSV n’est pas disponible.');
  let cleaned=String(raw||'').replace(/^\uFEFF/,'');
  const lines=cleaned.split(/\r?\n/);
  // Certains exports NotebookLM ajoutent le nom du fichier avant l'en-tête Front;Back.
  if(lines.length>1 && !/[;,\t]/.test(lines[0]) && /^(front|recto)[;,\t](back|verso)/i.test(lines[1].trim())){
    cleaned=lines.slice(1).join('\n');
  }
  const wb=XLSX.read(cleaned,{type:'string',raw:false});
  const ws=wb.Sheets[wb.SheetNames[0]];
  return XLSX.utils.sheet_to_json(ws,{defval:'',raw:false});
}
function splitOptions(value){return text(value).split(/\\s*(?:\\||;|\\n)\\s*/).map(text).filter(Boolean);}
function answerIndex(answer,options){
  const a=text(answer); if(!a)return -1;
  const letter=a.match(/^\s*([A-Za-z])(?:\s*[.):-]|\s+)/);
  if(letter){const i=letter[1].toUpperCase().charCodeAt(0)-65;if(i>=0&&i<options.length)return i;}
  if(/^[A-Za-z]$/.test(a)){const i=a.toUpperCase().charCodeAt(0)-65;if(i>=0&&i<options.length)return i;}
  const number=a.match(/^\s*(\d+)(?:\s*[.):-]|\s+)/);
  if(number){const i=Number(number[1])-1;if(i>=0&&i<options.length)return i;}
  if(/^\d+$/.test(a)){const i=Number(a)-1;if(i>=0&&i<options.length)return i;}
  const exact=options.findIndex(o=>normKey(o)===normKey(a));
  if(exact>=0)return exact;
  return options.findIndex(o=>normKey(a).endsWith(normKey(o)));
}
function shuffledCopy(items){
  const copy=items.slice();
  for(let i=copy.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [copy[i],copy[j]]=[copy[j],copy[i]];
  }
  return copy;
}
function quizRows(rows,fallback){
  const out=[];
  rows.forEach((row,i)=>{
    const question=field(row,['Question','Enoncé','Énoncé','Intitulé']); if(!question)return;
    const group=field(row,['Quiz','Quizz','Groupe','Série','Serie','Thème','Theme'])||fallback;
    let options=[];
    ['Réponse A','Reponse A','Option A','Choix A','A','Réponse B','Reponse B','Option B','Choix B','B','Réponse C','Reponse C','Option C','Choix C','C','Réponse D','Reponse D','Option D','Choix D','D','Réponse E','Reponse E','Option E','Choix E','E'].forEach((name,idx)=>{
      const v=field(row,[name]); if(v){options[idx%5]=v;}
    });
    options=options.filter(Boolean);
    if(!options.length) options=splitOptions(field(row,['Réponses','Reponses','Options','Choix','Propositions']));
    const answer=field(row,['Bonne réponse','Bonne reponse','Réponse correcte','Reponse correcte','Correct Answer','Correct','Solution']);
    const correct=answerIndex(answer,options);
    if(options.length<2||correct<0){console.warn('Question ignorée : réponse ou options non reconnues, ligne '+(i+2),row);return;}
    out.push({group,question,options,correct,explanation:field(row,['Explication','Commentaire','Justification','Correction','Rationale']),category:field(row,['Catégorie','Categorie','Notion','Chapitre']),hint:field(row,['Hint','Indice','Aide'])});
  });
  return out;
}
function flashRows(rows,fallback){
  const out=[];
  rows.forEach(row=>{
    const front=field(row,['Recto','Question','Terme','Face A','Avant']);
    const back=field(row,['Verso','Réponse','Reponse','Définition','Definition','Face B','Arrière','Arriere']);
    if(!front||!back)return;
    out.push({group:field(row,['Jeu','Deck','Paquet','Groupe','Série','Serie','Thème','Theme'])||fallback,front,back,category:field(row,['Catégorie','Categorie','Notion','Chapitre']),hint:field(row,['Hint','Indice','Aide'])});
  });
  return out;
}
function addToMap(map,items){items.forEach(item=>{if(!map.has(item.group))map.set(item.group,[]);map.get(item.group).push(item);});}
async function loadURL(url,type){
  try{const r=await fetch(url,{cache:'no-store'});if(!r.ok)return false;const raw=await r.text();const rows=parseDelimited(raw);const fallback=url.split('/').pop().replace(/\\.csv$/i,'').replace(/[_-]+/g,' ');addToMap(type==='quiz'?state.quizSets:state.flashSets,type==='quiz'?quizRows(rows,fallback):flashRows(rows,fallback));return true;}catch(err){console.warn('Fichier non chargé : '+url,err);return false;}
}
function injectButtons(){
  let bar=document.querySelector('.module-buttons');
  if(!bar){
    const header=document.querySelector('header');
    if(!header)return setTimeout(injectButtons,100);
    bar=document.createElement('div');
    bar.className='module-buttons learning-tools';
    const legend=header.querySelector('.legend');
    header.insertBefore(bar,legend||null);
  } else {
    bar.classList.add('learning-tools');
  }

  let quiz=document.getElementById('quizOpen');
  if(!quiz){
    quiz=document.createElement('button');
    quiz.type='button';
    quiz.id='quizOpen';
    quiz.className='learning-tool-button';
    quiz.textContent='Quiz';
    quiz.setAttribute('onclick','window.__openFassbinderQuiz && window.__openFassbinderQuiz()');
    bar.appendChild(quiz);
  }
  quiz.onclick=openQuiz;

  let flash=document.getElementById('flashOpen');

    bar.appendChild(flash);
  }
  flash.onclick=openFlash;
}
function openDrawer(){drawer.classList.add('open');overlay.classList.add('open');drawer.setAttribute('aria-hidden','false');overlay.setAttribute('aria-hidden','false');document.body.style.overflow='hidden';}
function closeDrawer(){drawer.classList.remove('open');overlay.classList.remove('open');drawer.setAttribute('aria-hidden','true');overlay.setAttribute('aria-hidden','true');document.body.style.overflow='';}
closeBtn.addEventListener('click',closeDrawer);overlay.addEventListener('click',closeDrawer);document.addEventListener('keydown',e=>{if(e.key==='Escape'&&drawer.classList.contains('open'))closeDrawer();});
function setOptions(select,map){select.innerHTML=[...map.keys()].map(k=>'<option value="'+escapeHTML(k)+'">'+escapeHTML(k)+'</option>').join('');}
function statusEl(msg,cls=''){return '<div class="learning-status '+cls+'">'+escapeHTML(msg)+'</div>';}
function quizShell(){content.innerHTML='<p class="learning-kicker">Réviser et vérifier ses connaissances</p><h2>Quiz</h2><p class="learning-intro">Choisissez un quiz. Les lignes du CSV sont regroupées selon la colonne « Quiz » ; une nouvelle valeur dans cette colonne crée automatiquement un nouveau quiz.</p><div class="learning-toolbar"><select id="quizSet" aria-label="Choisir un quiz"></select><button class="learning-action primary" id="quizStart" type="button">Commencer en ordre aléatoire</button><button class="learning-action" id="quizShuffle" type="button">Remélanger</button><label class="learning-file-label">Importer un ou plusieurs CSV<input id="quizFiles" type="file" accept=".csv,text/csv" multiple></label><div id="quizStatus" class="learning-status"></div></div><div id="quizStage"></div>';
  const select=content.querySelector('#quizSet');setOptions(select,state.quizSets);
  content.querySelector('#quizStart').onclick=()=>startQuiz(select.value,true);
  content.querySelector('#quizShuffle').onclick=()=>startQuiz(select.value,true);
  content.querySelector('#quizFiles').onchange=e=>importFiles(e.target.files,'quiz');
  renderQuizEmpty();
}
function renderQuizEmpty(){const stage=content.querySelector('#quizStage');if(!stage)return;stage.innerHTML=state.quizSets.size?'<div class="learning-empty">Sélectionnez un quiz puis cliquez sur « Commencer ».</div>':'<div class="learning-empty">Aucun fichier chargé. Placez <strong>RWF_Quiz.csv</strong> à côté de l’index ou importez un ou plusieurs fichiers CSV.</div>';}
function startQuiz(name,shuffle=true){const source=state.quizSets.get(name)||[];const questions=(shuffle?shuffledCopy(source):source.slice()).map(q=>({...q,options:[...q.options]}));state.quiz={name,questions,index:0,score:0,answered:false,shuffle};renderQuizQuestion();}
function renderQuizQuestion(){const stage=content.querySelector('#quizStage'),qz=state.quiz;if(!stage||!qz)return;if(qz.index>=qz.questions.length)return renderQuizSummary();const q=qz.questions[qz.index];stage.innerHTML='<div class="quiz-progress">Question '+(qz.index+1)+' / '+qz.questions.length+(q.category?' · '+escapeHTML(q.category):'')+'</div><article class="quiz-card"><h3 class="quiz-question">'+escapeHTML(q.question)+'</h3><div class="quiz-options">'+q.options.map((o,i)=>'<button class="quiz-option" type="button" data-answer="'+i+'"><span class="quiz-option-letter">'+String.fromCharCode(65+i)+'</span><span>'+escapeHTML(o)+'</span></button>').join('')+'</div><div id="quizFeedback"></div><div class="quiz-nav"><button class="learning-action" type="button" id="quizRestart">Recommencer</button><button class="learning-action primary" type="button" id="quizNext" disabled>'+(qz.index===qz.questions.length-1?'Voir le résultat':'Question suivante')+'</button></div></article>';
  stage.querySelectorAll('[data-answer]').forEach(btn=>btn.onclick=()=>answerQuiz(Number(btn.dataset.answer)));
  stage.querySelector('#quizRestart').onclick=()=>startQuiz(qz.name,qz.shuffle);stage.querySelector('#quizNext').onclick=()=>{qz.index++;qz.answered=false;renderQuizQuestion();};}
function answerQuiz(choice){const qz=state.quiz;if(!qz||qz.answered)return;qz.answered=true;const q=qz.questions[qz.index];if(choice===q.correct)qz.score++;content.querySelectorAll('[data-answer]').forEach((b,i)=>{b.disabled=true;if(i===q.correct)b.classList.add('correct');else if(i===choice)b.classList.add('wrong');});content.querySelector('#quizFeedback').innerHTML='<div class="quiz-feedback"><strong>'+(choice===q.correct?'Bonne réponse.':'Réponse incorrecte.')+'</strong>'+(q.explanation?'<br>'+escapeHTML(q.explanation):'')+'</div>';content.querySelector('#quizNext').disabled=false;}
function renderQuizSummary(){const stage=content.querySelector('#quizStage'),qz=state.quiz;const pct=Math.round((qz.score/qz.questions.length)*100);stage.innerHTML='<div class="quiz-summary"><p class="learning-kicker">Résultat</p><div class="quiz-score">'+qz.score+' / '+qz.questions.length+'</div><p>'+pct+' % de réponses correctes</p><button class="learning-action primary" type="button" id="quizAgain">Recommencer ce quiz</button></div>';stage.querySelector('#quizAgain').onclick=()=>startQuiz(qz.name,qz.shuffle);}
function flashShell(){content.innerHTML='<p class="learning-kicker">Mémoriser par rappel actif</p><h2>Flashcards</h2><p class="learning-intro">Cliquez sur la carte pour la retourner. Les lignes sont regroupées selon la colonne « Jeu » ou « Deck » ; une nouvelle valeur crée automatiquement un nouveau paquet.</p><div class="learning-toolbar"><select id="flashSet" aria-label="Choisir un jeu de flashcards"></select><button class="learning-action primary" id="flashStart" type="button">Ouvrir en ordre aléatoire</button><button class="learning-action" id="flashShuffle" type="button">Remélanger</button><label class="learning-file-label">Importer un ou plusieurs CSV<input id="flashFiles" type="file" accept=".csv,text/csv" multiple></label><div id="flashStatus" class="learning-status"></div></div><div id="flashStage"></div>';
  const select=content.querySelector('#flashSet');setOptions(select,state.flashSets);content.querySelector('#flashStart').onclick=()=>startFlash(select.value,true);content.querySelector('#flashShuffle').onclick=()=>startFlash(select.value,true);content.querySelector('#flashFiles').onchange=e=>importFiles(e.target.files,'flash');renderFlashEmpty();}
function renderFlashEmpty(){const stage=content.querySelector('#flashStage');if(!stage)return;stage.innerHTML=state.flashSets.size?'<div class="learning-empty">Sélectionnez un jeu puis cliquez sur « Ouvrir ».</div>':'<div class="learning-empty">Aucun fichier chargé. Placez <strong>RWF_Flashcards.csv</strong> à côté de l’index ou importez un ou plusieurs fichiers CSV.</div>';}
function startFlash(name,shuffle=true){const source=state.flashSets.get(name)||[];const cards=(shuffle?shuffledCopy(source):source.slice()).map(c=>({...c}));state.flash={name,cards,index:0,shuffle};renderFlashCard();}
function renderFlashCard(){const stage=content.querySelector('#flashStage'),fs=state.flash;if(!stage||!fs||!fs.cards.length)return renderFlashEmpty();const c=fs.cards[fs.index];stage.innerHTML='<div class="quiz-progress">'+escapeHTML(fs.name)+(c.category?' · '+escapeHTML(c.category):'')+'</div><div class="flashcard-wrap"><div class="flashcard" id="flashCard" tabindex="0" role="button" aria-label="Retourner la carte"><div class="flash-face front"><div class="flash-label">Question</div><div class="flash-text">'+escapeHTML(c.front)+'</div><div class="flash-hint">Cliquer pour afficher la réponse</div></div><div class="flash-face back"><div class="flash-label">Réponse</div><div class="flash-text">'+escapeHTML(c.back)+'</div><div class="flash-hint">Cliquer pour revenir à la question</div></div></div></div><div class="flash-controls"><button class="learning-action" id="flashPrev" type="button">← Précédente</button><span class="flash-counter">'+(fs.index+1)+' / '+fs.cards.length+'</span><button class="learning-action primary" id="flashNext" type="button">Suivante →</button></div>';
  const card=stage.querySelector('#flashCard');const flip=()=>card.classList.toggle('flipped');card.onclick=flip;card.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();flip();}};stage.querySelector('#flashPrev').onclick=()=>{fs.index=(fs.index-1+fs.cards.length)%fs.cards.length;renderFlashCard();};stage.querySelector('#flashNext').onclick=()=>{fs.index=(fs.index+1)%fs.cards.length;renderFlashCard();};}
async function importFiles(files,type){const map=type==='quiz'?state.quizSets:state.flashSets;let added=0,ignored=0;for(const file of files){try{const raw=await file.text();const rows=parseDelimited(raw);const fallback=file.name.replace(/\\.csv$/i,'').replace(/[_-]+/g,' ');const items=type==='quiz'?quizRows(rows,fallback):flashRows(rows,fallback);if(items.length){addToMap(map,items);added+=items.length;}else ignored++;}catch(err){console.error(err);ignored++;}}
  if(type==='quiz'){quizShell();content.querySelector('#quizStatus').textContent=added+' question(s) ajoutée(s)'+(ignored?' · '+ignored+' fichier(s) sans ligne reconnue':'');content.querySelector('#quizStatus').className='learning-status '+(added?'ok':'err');}
  else{flashShell();content.querySelector('#flashStatus').textContent=added+' carte(s) ajoutée(s)'+(ignored?' · '+ignored+' fichier(s) sans ligne reconnue':'');content.querySelector('#flashStatus').className='learning-status '+(added?'ok':'err');}}
function openQuiz(){quizShell();openDrawer();}

window.__openFassbinderQuiz=openQuiz;

document.addEventListener('click',function(event){
  const quizButton=event.target.closest && event.target.closest('#quizOpen');

Promise.all([...DEFAULT_QUIZ_FILES.map(f=>loadURL(f,'quiz')),...DEFAULT_FLASHCARD_FILES.map(f=>loadURL(f,'flash'))]).finally(injectButtons);

})();
<\/script>`;

  try{
    const response=await fetch(sourceUrl,{cache:'no-store'});
    if(!response.ok)throw new Error('Version 2.7 inaccessible ('+response.status+')');
    let source=await response.text();
    source=source.replaceAll('Version 2.7','Version 3.0');

    // V2.9 : insertion statique et robuste des deux nouveaux modules dans la barre existante.
    source=source.replace(
      /(<div class="module-buttons">[\s\S]*?<\/div>)/,
      function(block){
        if(block.includes('id="quizOpen"')) return block;
        return block.replace(
          '</div>',
          '<button class="learning-tool-button" id="quizOpen" type="button" onclick="window.__openFassbinderQuiz && window.__openFassbinderQuiz()">Quiz</button>'+
          '<button class="learning-tool-button" id="flashOpen" type="button" onclick="window.__openFassbinderFlashcards && window.__openFassbinderFlashcards()">Flashcards</button>'+
          '</div>'
        );
      }
    );

    // V2.8 conservée : lecture robuste de plusieurs liens dans une cellule de la frise.
    const v28Override = `<script id="v28-multilinks-fix">
parseLinksCell = function(ws,r,c,cellText){
  const cell=ws[XLSX.utils.encode_cell({r,c})];
  const nativeUrl=(cell && cell.l && cell.l.Target) ? cell.l.Target.trim() : '';
  const chunks=(cellText||'').split(/[;\n]/).map(s=>s.trim()).filter(Boolean);
  if(!chunks.length){
    if(!nativeUrl) return [];
    const kind=classifyLinkKind(nativeUrl);
    return [{url:nativeUrl,kind,customLabel:false,label:defaultLinkLabel(kind,0,1)}];
  }
  const links=[];
  chunks.forEach((chunk,i)=>{
    const pipeIdx=chunk.indexOf('|');
    let label='',url='';
    if(pipeIdx>-1){ label=chunk.slice(0,pipeIdx).trim(); url=chunk.slice(pipeIdx+1).trim(); }
    else if(/^(https?:\/\/|www\.)/i.test(chunk)){ url=chunk; }
    else if(i===0 && nativeUrl){ label=chunk; url=nativeUrl; }
    else { console.warn('Lien non identifié dans la frise : « '+chunk+' ». Utilisez « Libellé|https://adresse » pour les liens supplémentaires.'); return; }
    if(/^www\./i.test(url)) url='https://'+url;
    if(!url) return;
    const kind=classifyLinkKind(url);
    links.push({url,kind,customLabel:Boolean(label),label:label || defaultLinkLabel(kind,links.length,chunks.length)});
  });
  return links;
};
<\/script>`;
    if(!source.includes('</head>')||!source.includes('</body>'))throw new Error('Structure HTML de la version 2.7 non reconnue.');
    source=source.replace('</head>',learningCSS+'\n</head>');
    source=source.replace('</body>',v28Override+'\n'+learningHTML+'\n'+learningJS+'\n</body>');
    document.open();document.write(source);document.close();
  }catch(error){
    document.getElementById('v30-loader').textContent='Erreur de chargement de la version 3.0 : '+error.message;
    console.error(error);
  }
})();
